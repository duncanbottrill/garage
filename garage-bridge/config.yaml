name: "Garage Bridge"
version: "0.2.0"
slug: "garage_bridge"
description: "Tesla Fleet Telemetry receiver, command signing proxy and Supabase ingest for Garage"
url: "https://github.com/duncanbottrill/garage"
arch: [aarch64, amd64]
init: false
startup: services
boot: auto
image: "ghcr.io/duncanbottrill/garage-bridge-{arch}"
map:
  - type: share
    read_only: false
ports:
  "8443/tcp": 8443
  "9090/tcp": null
ports_description:
  "8443/tcp": "Fleet Telemetry receiver (mTLS) — forward external TCP 443 here"
  "9090/tcp": "fleet-telemetry Prometheus metrics (internal)"
watchdog: "tcp://[HOST]:[PORT:9090]"
options:
  tailscale_enabled: true
  tailscale_authkey: ""
  tailscale_hostname: "garage-bridge"
  telemetry_hostname: ""
  tesla_private_key: ""
  tesla_vin: ""
  garage_api_base: "https://garage.duncanbottrill.com"
  bridge_secret: ""
  supabase_url: ""
  supabase_service_key: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  log_level: "info"
schema:
  tailscale_enabled: bool
  tailscale_authkey: password?
  tailscale_hostname: str
  telemetry_hostname: str?
  tesla_private_key: password?
  tesla_vin: str
  garage_api_base: url
  bridge_secret: password?
  supabase_url: url?
  supabase_service_key: password?
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(trace|debug|info|warning|error)
